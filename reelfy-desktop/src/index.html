<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reelfy Studio</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        background: #0a0c10;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-user-select: none; user-select: none;
      }
      .wrap { text-align: center; }
      .logo { font-size: 34px; font-weight: 800; color: #e9edf4; }
      .logo .fy {
        background: linear-gradient(90deg, #ff5a3c, #ffb020);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .tag { font-size: 13px; color: #5d6678; letter-spacing: .22em; font-weight: 700; margin-left: 4px; }
      .spin {
        margin: 26px auto 0; width: 26px; height: 26px;
        border: 3px solid #252a35; border-top-color: #ff5a3c; border-radius: 50%;
        animation: s .7s linear infinite;
      }
      .msg { margin-top: 18px; color: #8b95a7; font-size: 13px; }
      .err { max-width: 520px; color: #e9edf4; }
      .err h1 { font-size: 22px; font-weight: 700; margin: 0 0 12px; }
      .err p { color: #8b95a7; font-size: 14px; line-height: 1.6; }
      .err small { color: #5d6678; font-size: 12px; }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="wrap" id="wrap">
      <div class="logo">Reel<span class="fy">fy</span><span class="tag">STUDIO</span></div>
      <div class="spin"></div>
      <div class="msg" id="msg">Iniciando el motor de IA local…</div>
    </div>
  </body>
</html>
