name: Reelfy Desktop (build)

# Compila la app de escritorio (Tauri + motor embebido) por SO y, al taguear
# reelfy-v*, publica un GitHub Release con los 3 instaladores.
on:
  workflow_dispatch:
    inputs:
      incluir_macos:
        description: "Incluir macOS (cuesta 10x minutos)"
        type: boolean
        default: false
  push:
    tags:
      - "reelfy-v*"

concurrency:
  group: reelfy-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macOS cuesta 10x minutos de Actions, así que SOLO se compila al publicar un
    # release (tag reelfy-v*) o si se pide explícitamente en el dispatch. Linux (1x)
    # y Windows (2x) corren siempre: cubren la verificación del día a día.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(
          (startsWith(github.ref, 'refs/tags/') || inputs.incluir_macos)
          && '[{"os":"ubuntu-22.04","script":"assemble-engine-linux.sh","artifact":"reelfy-linux","bundles":"deb"},{"os":"windows-latest","script":"assemble-engine-windows.ps1","artifact":"reelfy-windows","bundles":"nsis"},{"os":"macos-14","script":"assemble-engine-macos.sh","artifact":"reelfy-macos","bundles":"dmg"}]'
          || '[{"os":"ubuntu-22.04","script":"assemble-engine-linux.sh","artifact":"reelfy-linux","bundles":"deb"},{"os":"windows-latest","script":"assemble-engine-windows.ps1","artifact":"reelfy-windows","bundles":"nsis"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reelfy-desktop/src-tauri/target
          # v2: invalidada tras renombrar el repo clipfy->reelfy (la caché vieja
          # guardaba rutas absolutas .../clipfy/clipfy que ya no existen y rompían
          # el build de Tauri con "failed to read plugin permissions").
          key: cargo-v2-${{ matrix.os }}-${{ hashFiles('reelfy-desktop/src-tauri/Cargo.lock') }}

      - name: Deps de Linux (webkit + build + patchelf)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf cmake build-essential libfuse2 zstd

      - name: Deps de macOS (ollama para el LLM embebido)
        if: matrix.os == 'macos-14'
        run: brew install ollama cmake

      - name: Compilar whisper.cpp (CPU)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp spike/whisper.cpp
          cmake -S spike/whisper.cpp -B spike/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build spike/whisper.cpp/build --config Release -j 4 --target whisper-cli
          find spike/whisper.cpp/build -name "whisper-cli*" || true

      - name: Ensamblar el motor (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash reelfy-desktop/scripts/${{ matrix.script }}

      - name: Ensamblar el motor (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: reelfy-desktop/scripts/${{ matrix.script }}

      # Apple exige que TODO binario Mach-O anidado venga firmado con Developer ID
      # y timestamp seguro. Tauri firma el .app pero no los ~400 binarios del motor
      # (python, torch —trae ejecutables sin extensión—, ffmpeg, ollama, whisper).
      # Sin esto la notarización devuelve Invalid.
      - name: Firmar binarios del motor (macOS, deep sign)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          CERT_B64: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_ID: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -z "$CERT_B64" ]; then echo "sin cert -> se omite la firma profunda"; exit 0; fi
          KC="$RUNNER_TEMP/reelfy-sign.keychain-db"
          KCPASS="ci$(openssl rand -hex 8)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

          ENGINE="reelfy-desktop/src-tauri/engine"
          ENT="$PWD/reelfy-desktop/src-tauri/entitlements.plist"
          # 1) todo Mach-O detectado por contenido (no por extensión), hojas primero
          LIST="$RUNNER_TEMP/macho.txt"; : > "$LIST"
          while IFS= read -r f; do
            case "$(file -b "$f" 2>/dev/null)" in Mach-O*) printf '%s\n' "$f" >> "$LIST";; esac
          done < <(find "$ENGINE" -type f)
          echo "binarios Mach-O a firmar: $(wc -l < "$LIST" | tr -d ' ')"
          awk '{print gsub(/\//,"/")"\t"$0}' "$LIST" | sort -rn | cut -f2- | while IFS= read -r f; do
            codesign --force --timestamp --options runtime --keychain "$KC" -s "$SIGN_ID" "$f" 2>/dev/null
          done
          # 2) los que hacen JIT/Metal necesitan entitlements
          for j in "$ENGINE"/python/bin/python3.12 \
                   "$ENGINE"/bin/ollama-runtime/ollama \
                   "$ENGINE"/bin/ollama-runtime/lib/ollama/llama-server; do
            [ -f "$j" ] && codesign --force --timestamp --options runtime --entitlements "$ENT" \
              --keychain "$KC" -s "$SIGN_ID" "$j"
          done
          echo "firma profunda del motor completa"

      - name: npm ci
        working-directory: reelfy-desktop
        run: npm ci

      # Notarización macOS: si hay secret con la ASC API key (.p8 en base64), la
      # escribimos y exponemos su ruta; si no, el build queda sin notarizar.
      - name: Preparar ASC API key (notarización macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"
          fi

      # La caché de Cargo restaura target/release/bundle con instaladores de
      # builds anteriores (versión vieja) y el glob de subida los arrastraría.
      - name: Limpiar bundles de la caché
        shell: bash
        run: rm -rf reelfy-desktop/src-tauri/target/release/bundle

      - name: Tauri build
        working-directory: reelfy-desktop
        env:
          # AppImage (no usado ahora, pero por si acaso): extract-and-run por FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
          # Firma + notarización macOS (activa solo si los secrets existen; si no,
          # Tauri hace build sin firmar y no rompe).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      # El DMG de Tauri se arma con AppleScript de Finder, que FALLA SILENCIOSO
      # en runners headless -> DMG sin fondo ni layout (bug v0.2.0/v0.2.1).
      # dmgbuild escribe el .DS_Store y el fondo DENTRO del DMG (sin Finder), así
      # que el resultado es idéntico en CI y local. Reempaquetamos el .app
      # (ya firmado+notarizado por Tauri) en un DMG de marca.
      - name: DMG de marca (dmgbuild, sin Finder)
        if: matrix.os == 'macos-14'
        shell: bash
        run: |
          cd reelfy-desktop/src-tauri
          DMG=$(ls target/release/bundle/dmg/*.dmg | head -1)
          echo "reempaquetando $DMG"
          VOL=$(hdiutil attach "$DMG" -nobrowse | grep -oE "/Volumes/.+" | head -1)
          rm -rf target/release/bundle/macos/Reelfy.app
          mkdir -p target/release/bundle/macos
          cp -R "$VOL/Reelfy.app" target/release/bundle/macos/
          hdiutil detach "$VOL"
          # estampar la app (Tauri ya la notarizó; el ticket existe en Apple)
          xcrun stapler staple target/release/bundle/macos/Reelfy.app || true
          pipx install dmgbuild >/dev/null 2>&1 || python3 -m pip install -q --break-system-packages dmgbuild
          DMGBUILD=$(command -v dmgbuild || echo "$HOME/.local/bin/dmgbuild")
          rm -f "$DMG"
          "$DMGBUILD" -s ../scripts/dmg_settings.py -D app=target/release/bundle/macos/Reelfy.app Reelfy "$DMG"
          echo "== verificación: fondo y layout DENTRO del dmg =="
          VOL=$(hdiutil attach "$DMG" -nobrowse | grep -oE "/Volumes/.+" | head -1)
          ls -la "$VOL" | grep -iE "background|DS_Store"
          hdiutil detach "$VOL"

      # dmgbuild genera un DMG nuevo -> notarizarlo y estamparlo (validación
      # offline). La app interna ya va notarizada y estampada.
      - name: Notarizar y estampar el DMG (validación offline)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          DMG=$(ls reelfy-desktop/src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ] || [ -z "${APPLE_API_KEY_PATH:-}" ] || [ -z "$KEY_ID" ]; then
            echo "sin DMG o sin credenciales de notarización -> se omite"; exit 0
          fi
          xcrun notarytool submit "$DMG" --key "$APPLE_API_KEY_PATH" \
            --key-id "$KEY_ID" --issuer "$ISSUER" --wait || true
          xcrun stapler staple "$DMG" && xcrun stapler validate "$DMG" || \
            echo "no se pudo estampar (la app interna sigue notarizada)"

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          # Solo instaladores (el .app crudo pierde symlinks al zipearse).
          path: |
            reelfy-desktop/src-tauri/target/release/bundle/**/*.dmg
            reelfy-desktop/src-tauri/target/release/bundle/**/*.deb
            reelfy-desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            reelfy-desktop/src-tauri/target/release/bundle/**/*.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reelfy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*-setup.exe
            dist/**/*.msi
