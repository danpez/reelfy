name: Reelfy Desktop (build)

# Compila la app de escritorio (Tauri + motor embebido) por SO y, al taguear
# reelfy-v*, publica un GitHub Release con los 3 instaladores.
on:
  workflow_dispatch:
  push:
    tags:
      - "reelfy-v*"

concurrency:
  group: reelfy-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            script: assemble-engine-macos.sh
            artifact: reelfy-macos
            bundles: "dmg"
          - os: ubuntu-22.04
            script: assemble-engine-linux.sh
            artifact: reelfy-linux
            # deb: rápido, sin linuxdeploy/FUSE, cubre Ubuntu/Debian/Mint.
            # (AppImage universal queda pendiente como mejora.)
            bundles: "deb"
          - os: windows-latest
            script: assemble-engine-windows.ps1
            artifact: reelfy-windows
            bundles: "nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en disco (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            reelfy-desktop/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('reelfy-desktop/src-tauri/Cargo.lock') }}

      - name: Deps de Linux (webkit + build + patchelf)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf cmake build-essential libfuse2

      - name: Deps de macOS (ollama para el LLM embebido)
        if: matrix.os == 'macos-14'
        run: brew install ollama cmake

      - name: Compilar whisper.cpp (CPU)
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggerganov/whisper.cpp spike/whisper.cpp
          cmake -S spike/whisper.cpp -B spike/whisper.cpp/build -DCMAKE_BUILD_TYPE=Release -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build spike/whisper.cpp/build --config Release -j 4 --target whisper-cli
          find spike/whisper.cpp/build -name "whisper-cli*" || true

      - name: Ensamblar el motor (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: bash reelfy-desktop/scripts/${{ matrix.script }}

      - name: Ensamblar el motor (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: reelfy-desktop/scripts/${{ matrix.script }}

      - name: npm ci
        working-directory: reelfy-desktop
        run: npm ci

      # Notarización macOS: si hay secret con la ASC API key (.p8 en base64), la
      # escribimos y exponemos su ruta; si no, el build queda sin notarizar.
      - name: Preparar ASC API key (notarización macOS)
        if: matrix.os == 'macos-14'
        shell: bash
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/asc_key.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/asc_key.p8" >> "$GITHUB_ENV"
          fi

      - name: Tauri build
        working-directory: reelfy-desktop
        env:
          # AppImage (no usado ahora, pero por si acaso): extract-and-run por FUSE.
          APPIMAGE_EXTRACT_AND_RUN: 1
          NO_STRIP: "true"
          # Firma + notarización macOS (activa solo si los secrets existen; si no,
          # Tauri hace build sin firmar y no rompe).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 14
          # Solo instaladores (el .app crudo pierde symlinks al zipearse).
          path: |
            reelfy-desktop/src-tauri/target/release/bundle/**/*.dmg
            reelfy-desktop/src-tauri/target/release/bundle/**/*.deb
            reelfy-desktop/src-tauri/target/release/bundle/**/*.exe
            reelfy-desktop/src-tauri/target/release/bundle/**/*.msi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar todos los artefactos
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Reelfy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.exe
            dist/**/*.msi
